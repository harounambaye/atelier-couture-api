<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="API Atelier de couture - FastAPI, PostgreSQL, JWT">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>

  <!-- fil qui serpente -->
  <path d="M0 262 C 160 200, 260 310, 420 250 S 700 190, 860 262 S 1100 300, 1200 220"
        fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-dasharray="3 8" stroke-linecap="round" opacity="0.7"/>

  <!-- mètre ruban -->
  <g transform="translate(0,28)">
    <rect x="48" y="0" width="1104" height="26" rx="4" fill="url(#tape)" opacity="0.95"/>
    <g stroke="#78350f" stroke-width="1.5">
      <path d="M72 26v-10M96 26v-10M120 26v-10M144 26v-10M168 26v-10M192 26v-10M216 26v-10M240 26v-10M264 26v-10M288 26v-10M312 26v-10M336 26v-10M360 26v-10M384 26v-10M408 26v-10M432 26v-10M456 26v-10M480 26v-10M504 26v-10M528 26v-10M552 26v-10M576 26v-10M600 26v-10M624 26v-10M648 26v-10M672 26v-10M696 26v-10M720 26v-10M744 26v-10M768 26v-10M792 26v-10M816 26v-10M840 26v-10M864 26v-10M888 26v-10M912 26v-10M936 26v-10M960 26v-10M984 26v-10M1008 26v-10M1032 26v-10M1056 26v-10M1080 26v-10M1104 26v-10M1128 26v-10"/>
      <path d="M96 26v-18M192 26v-18M288 26v-18M384 26v-18M480 26v-18M576 26v-18M672 26v-18M768 26v-18M864 26v-18M960 26v-18M1056 26v-18" stroke-width="2.5"/>
    </g>
  </g>

  <!-- icône : aiguille + fil -->
  <g transform="translate(90,120)">
    <circle cx="70" cy="70" r="70" fill="#ffffff" fill-opacity="0.06" stroke="url(#accent)" stroke-width="2"/>
    <!-- aiguille -->
    <g transform="rotate(-40 70 70)">
      <rect x="66" y="14" width="8" height="112" rx="4" fill="#e2e8f0"/>
      <ellipse cx="70" cy="30" rx="2.6" ry="9" fill="#312e81"/>
      <path d="M66 120 L70 136 L74 120Z" fill="#e2e8f0"/>
    </g>
    <!-- fil -->
    <path d="M70 34 C 20 40, 30 100, 80 98 S 120 70, 104 52" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- titre -->
  <text x="270" y="170" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff">Atelier Couture <tspan fill="url(#accent)">API</tspan></text>
  <text x="272" y="208" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#c7d2fe">Clients · Mesures · Commandes · Paiements · Livraisons</text>

  <!-- badges techno -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">
    <rect x="272" y="236" width="104" height="32" rx="16" fill="#059669"/><text x="324" y="257">FastAPI</text>
    <rect x="388" y="236" width="128" height="32" rx="16" fill="#2563eb"/><text x="452" y="257">PostgreSQL 17</text>
    <rect x="528" y="236" width="128" height="32" rx="16" fill="#b91c1c"/><text x="592" y="257">SQLAlchemy 2</text>
    <rect x="668" y="236" width="84" height="32" rx="16" fill="#7c3aed"/><text x="710" y="257">JWT</text>
    <rect x="764" y="236" width="92" height="32" rx="16" fill="#0891b2"/><text x="810" y="257">Docker</text>
    <rect x="868" y="236" width="92" height="32" rx="16" fill="#d97706"/><text x="914" y="257">pytest</text>
  </g>
</svg>
